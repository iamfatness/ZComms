name: macos

on:
  push:
    branches: [main, macos-port]
  pull_request:

jobs:
  build:
    # Explicit: with no name, both this job and windows.yml's job default to
    # "build" and produce two check-runs that are indistinguishable in the
    # GitHub UI and API by name alone -- confirmed live via check-runs on
    # commit 4be957f, both reporting {"name": "build"}. Whoever later wires
    # up "require the windows check" needs these to read apart at a glance.
    name: macOS build & test
    runs-on: macos-14
    # contents:read (the org default) 404s on a DRAFT release -- the releases
    # API only shows drafts to callers with push access, and a read-scoped
    # GITHUB_TOKEN doesn't qualify. write is still read-only in effect for
    # what this job does (download one asset); it exists to clear that bar.
    # Mirrors windows.yml's identical fetch step.
    permissions:
      contents: write
    steps:
      # persist-credentials: false -- checkout's default leaves a git
      # credential sitting in .git/config for the rest of the job. Nothing
      # after checkout here needs to push, and Configure/Build/Test run a
      # large amount of vendored/third-party code (speexdsp, miniaudio), so
      # the credential should not be reachable from it either.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch the Zoom macOS SDK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download sdk-assets --repo ${{ github.repository }} \
            --pattern zoom-sdk-macos-7.1.5.84750.zip --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/zoom-sdk-macos-7.1.5.84750.zip" -d "$RUNNER_TEMP/sdk"
          mkdir -p third_party/zoom-sdk
          # The framework sits under a ZoomSDK/ subdirectory inside the
          # version-named top directory -- not at the zip root.
          cp -R "$RUNNER_TEMP/sdk/zoom-sdk-macos-7.1.5.84750/ZoomSDK/ZoomSDK.framework" \
            third_party/zoom-sdk/

      - name: Verify the SDK landed
        run: |
          test -d third_party/zoom-sdk/ZoomSDK.framework
          test -f third_party/zoom-sdk/ZoomSDK.framework/Versions/A/Headers/ZoomSDKTalkbackController.h

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # Explicit targets, not the default "all" group: zcomms_zoom is now
      # SDK-gated on this platform too (Task 6's adapter), and the Zoom SDK
      # is not redistributable, so nothing here may build a target the SDK
      # can't satisfy. spike_a_tests is named explicitly alongside the other
      # two -- it needs no SDK and the unfiltered `ctest` below expects it
      # already built; dropping it from this list makes Test fail with
      # "Not Run" instead of never running it at all, which is worse: a
      # target silently rotting unbuilt would report green.
      - name: Build
        run: cmake --build build --target zcomms_audio_tests zcomms_zoom spike_a_tests

      - name: Test
        run: ctest --test-dir build --output-on-failure
