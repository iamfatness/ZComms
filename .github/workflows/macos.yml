name: macos

on:
  push:
    branches: [main, macos-port]
  pull_request:

jobs:
  build:
    # Explicit: with no name, both this job and windows.yml's job default to
    # "build" and produce two check-runs that are indistinguishable in the
    # GitHub UI and API by name alone -- confirmed live via check-runs on
    # commit 4be957f, both reporting {"name": "build"}. Whoever later wires
    # up "require the windows check" needs these to read apart at a glance.
    name: macOS build & test
    runs-on: macos-14
    steps:
      # persist-credentials: false -- checkout's default leaves a git
      # credential sitting in .git/config for the rest of the job. Nothing
      # after checkout here needs to push, and Configure/Build/Test run a
      # large amount of vendored/third-party code (speexdsp, miniaudio), so
      # the credential should not be reachable from it either.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No Zoom SDK here yet. zcomms_audio_tests links no sdk.lib by design,
      # so the whole suite runs without it. The SDK-dependent targets arrive
      # with the macOS adapter (Task 6).
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      # No --target: build the default "all" group, not just zcomms_audio_tests.
      # spikes/a-tx-latency registers spike_a_tests via add_test() unconditionally
      # and needs no SDK either, so it belongs in this job. Building everything
      # CMake knows how to build (SDK-gated targets are simply absent from the
      # tree when ZCOMMS_HAVE_SDK is false, so they cost nothing here) means the
      # unfiltered `ctest` below actually finds every executable it registers --
      # a future test target added but left unbuilt fails the build step itself
      # instead of failing invisibly at test time, and can't be masked by a
      # filter the way an `-R` on this step would mask it.
      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
